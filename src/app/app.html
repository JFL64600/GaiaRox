<header class="site-header">
  <a class="brand" routerLink="/" (click)="onBrandTap($event)">GaiaRox</a>
  <div class="header-controls">
    <div class="language-switch" role="group" [attr.aria-label]="i18n.t('language.label')">
      @for (language of languages; track language) {
        <button
          type="button"
          [attr.lang]="language"
          [attr.aria-pressed]="i18n.language() === language"
          (click)="i18n.setLanguage(language)"
        >
          {{ languageLabels[language] }}
        </button>
      }
    </div>
    <div class="theme-switch">
      <button
        type="button"
        class="theme-current"
        [style.background]="currentSwatch()"
        [attr.aria-label]="i18n.t('theme.label')"
        [attr.title]="i18n.t('theme.label')"        [attr.aria-expanded]="themeMenuOpen()"
        (click)="themeMenuOpen.set(!themeMenuOpen())"
      ></button>
      @if (themeMenuOpen()) {
        <div class="theme-menu" role="group" [attr.aria-label]="i18n.t('theme.label')">
          @for (option of themes; track option.id) {
            <button
              type="button"
              [style.background]="option.swatch"
              [attr.aria-label]="i18n.t(option.labelKey)"
              [attr.title]="i18n.t(option.labelKey)"
              [attr.aria-pressed]="themeService.theme() === option.id"
              (click)="chooseTheme(option.id)"
            ></button>
          }
        </div>
      }
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>
