<header class="site-header">
  <div class="brand-group">
    <a class="brand" [routerLink]="home()">GaiaRox</a>
    @if (chronometerStore.eventName(); as eventName) {
      <span class="event-title">- {{ eventName }}</span>
    }
    @if (chronometerStore.currentRoom()) {
      <button
        type="button"
        class="copy-link"
        [attr.aria-label]="i18n.t('sync.copyLink')"
        [attr.title]="i18n.t('sync.copyLink')"
        (click)="copyLink()"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path
            d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"
          />
        </svg>
      </button>
    }
  </div>
  <div class="header-controls">
    <div class="language-switch" role="group" [attr.aria-label]="i18n.t('language.label')">
      @for (language of languages; track language) {
        <button
          type="button"
          [attr.lang]="language"
          [attr.aria-pressed]="i18n.language() === language"
          (click)="i18n.setLanguage(language)"
        >
          {{ languageLabels[language] }}
        </button>
      }
    </div>
    <div class="theme-switch">
      <button
        type="button"
        class="theme-current"
        [style.background]="currentSwatch()"
        [attr.aria-label]="i18n.t('theme.label')"
        [attr.title]="i18n.t('theme.label')"
        [attr.aria-expanded]="themeMenuOpen()"
        (click)="themeMenuOpen.set(!themeMenuOpen())"
      ></button>
      @if (themeMenuOpen()) {
        <div class="theme-menu" role="group" [attr.aria-label]="i18n.t('theme.label')">
          @for (option of themes; track option.id) {
            <button
              type="button"
              [style.background]="option.swatch"
              [attr.aria-label]="i18n.t(option.labelKey)"
              [attr.title]="i18n.t(option.labelKey)"
              [attr.aria-pressed]="themeService.theme() === option.id"
              (click)="chooseTheme(option.id)"
            ></button>
          }
        </div>
      }
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>
