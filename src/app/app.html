<header class="site-header">
  <a class="brand" routerLink="/">GaiaRox</a>
  <div class="language-switch" role="group" [attr.aria-label]="i18n.t('language.label')">
    @for (language of languages; track language) {
      <button
        type="button"
        [attr.lang]="language"
        [attr.aria-pressed]="i18n.language() === language"
        (click)="i18n.setLanguage(language)"
      >
        {{ language.toUpperCase() }}
      </button>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
